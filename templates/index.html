<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Child Survival Probability Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .main-card {
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            overflow: hidden;
            background: white;
        }
        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 30px 40px;
            text-align: center;
        }
        .header h1 { font-size: 2rem; font-weight: 700; margin-bottom: 5px; }
        .header .subtitle { font-size: 1rem; opacity: 0.9; }
        .form-section { padding: 30px 40px 20px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { font-weight: 600; color: #2c3e50; font-size: 0.9rem; }
        .form-select {
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            padding: 10px 15px;
            font-size: 0.95rem;
        }
        .form-select:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 0.2rem rgba(52, 152, 219, 0.25);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.5rem; }
            .form-section { padding: 20px; }
        }
        .btn-predict {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            border: none;
            padding: 14px 50px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4);
            width: 100%;
            max-width: 300px;
        }
        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(52, 152, 219, 0.5);
            color: white;
        }
        .footer-actions {
            background: #f8f9fa;
            padding: 20px 40px;
            text-align: center;
            border-top: 1px solid #eee;
        }
        .section-title {
            color: #2c3e50;
            font-size: 1.1rem;
            font-weight: 600;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
            margin-bottom: 20px;
        }
        .section-title i { margin-right: 10px; color: #3498db; }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-card">
            <div class="header">
                <h1><i class="bi bi-heart-pulse"></i> Child Survival Predictor</h1>
                <p class="subtitle">Enter child and mother characteristics to predict survival probability</p>
            </div>
            
            <form action="/predict" method="POST">
                <div class="form-section">
                    <!-- Demographics -->
                    <div class="section-title"><i class="bi bi-globe"></i> Demographics</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="country">Country</label>
                            <select name="country" class="form-select" required>
                                {% for option in variables.country.options %}
                                <option value="{{ option }}">{{ option }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="matage">Mother's Age Group</label>
                            <select name="matage" class="form-select" required>
                                {% for option in variables.matage.options %}
                                <option value="{{ option }}">{{ option }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="childgender">Child Gender</label>
                            <select name="childgender" class="form-select" required>
                                {% for option in variables.childgender.options %}
                                <option value="{{ option }}">{{ option }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="householdsize">Household Size</label>
                            <select name="householdsize" class="form-select" required>
                                {% for option in variables.householdsize.options %}
                                <option value="{{ option }}">{{ option }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <!-- Household -->
                    <div class="section-title"><i class="bi bi-house"></i> Household & Socioeconomic</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="househeadage">Household Head Age</label>
                            <select name="househeadage" class="form-select" required>
                                {% for option in variables.househeadage.options %}
                                <option value="{{ option }}">{{ option }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="sexhousehead">Sex of Household Head</label>
                            <select name="sexhousehead" class="form-select" required>
                                {% for option in variables.sexhousehead.options %}
                                <option value="{{ option }}">{{ option }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="wealthindex">Wealth Index</label>
                            <select name="wealthindex" class="form-select" required>
                                {% for option in variables.wealthindex.options %}
                                <option value="{{ option }}">{{ option }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="matedu">Mother's Education</label>
                            <select name="matedu" class="form-select" required>
                                {% for option in variables.matedu.options %}
                                <option value="{{ option }}">{{ option }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="husbedu">Husband's Education</label>
                            <select name="husbedu" class="form-select" required>
                                {% for option in variables.husbedu.options %}
                                <option value="{{ option }}">{{ option }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="workinghusb">Husband Working Status</label>
                            <select name="workinghusb" class="form-select" required>
                                {% for option in variables.workinghusb.options %}
                                <option value="{{ option }}">{{ option }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="mediaexposure">Media Exposure</label>
                            <select name="mediaexposure" class="form-select" required>
                                {% for option in variables.mediaexposure.options %}
                                <option value="{{ option }}">{{ option }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <!-- Health -->
                    <div class="section-title"><i class="bi bi-heart"></i> Health & Healthcare</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="contraceptiveuse">Contraceptive Use</label>
                            <select name="contraceptiveuse" class="form-select" required>
                                {% for option in variables.contraceptiveuse.options %}
                                <option value="{{ option }}">{{ option }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="anc_visits">ANC Visits</label>
                            <select name="anc_visits" class="form-select" required>
                                {% for option in variables.anc_visits.options %}
                                <option value="{{ option }}">{{ option }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="placeofdelivery">Place of Delivery</label>
                            <select name="placeofdelivery" class="form-select" required>
                                {% for option in variables.placeofdelivery.options %}
                                <option value="{{ option }}">{{ option }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="deliverybycs">Delivery by C-Section</label>
                            <select name="deliverybycs" class="form-select" required>
                                {% for option in variables.deliverybycs.options %}
                                <option value="{{ option }}">{{ option }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="pnc">Postnatal Care (6 weeks)</label>
                            <select name="pnc" class="form-select" required>
                                {% for option in variables.pnc.options %}
                                <option value="{{ option }}">{{ option }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="immediate_bf">Immediate Breastfeeding</label>
                            <select name="immediate_bf" class="form-select" required>
                                {% for option in variables.immediate_bf.options %}
                                <option value="{{ option }}">{{ option }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <!-- Child & Birth -->
                    <div class="section-title"><i class="bi bi-baby"></i> Child & Birth</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="birthorder">Birth Order</label>
                            <select name="birthorder" class="form-select" required>
                                {% for option in variables.birthorder.options %}
                                <option value="{{ option }}">{{ option }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="twin">Twin Birth</label>
                            <select name="twin" class="form-select" required>
                                {% for option in variables.twin.options %}
                                <option value="{{ option }}">{{ option }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="parity">Parity</label>
                            <select name="parity" class="form-select" required>
                                {% for option in variables.parity.options %}
                                <option value="{{ option }}">{{ option }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="birthinterval">Preceding Birth Interval</label>
                            <select name="birthinterval" class="form-select" required>
                                {% for option in variables.birthinterval.options %}
                                <option value="{{ option }}">{{ option }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="teenagepx">Teenage Pregnancy</label>
                            <select name="teenagepx" class="form-select" required>
                                {% for option in variables.teenagepx.options %}
                                <option value="{{ option }}">{{ option }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <!-- Environment -->
                    <div class="section-title"><i class="bi bi-tree"></i> Environment</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="placeresid">Place of Residence</label>
                            <select name="placeresid" class="form-select" required>
                                {% for option in variables.placeresid.options %}
                                <option value="{{ option }}">{{ option }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="sanitation">Sanitation Type</label>
                            <select name="sanitation" class="form-select" required>
                                {% for option in variables.sanitation.options %}
                                <option value="{{ option }}">{{ option }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="watersource">Water Source</label>
                            <select name="watersource" class="form-select" required>
                                {% for option in variables.watersource.options %}
                                <option value="{{ option }}">{{ option }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="footer-actions">
                    <button type="submit" class="btn-predict">
                        <i class="bi bi-graph-up-arrow"></i> Predict Survival
                    </button>
                    <div style="margin-top: 10px; color: #7f8c8d; font-size: 0.85rem;">
                        <i class="bi bi-info-circle"></i> All fields are required
                    </div>
                </div>
            </form>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
